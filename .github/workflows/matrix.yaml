name: Matrix Demo
on: push
jobs:
  build:
    strategy:
      matrix:
        node-version: [ 12, 14, 16 ]
        OS: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.OS }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
