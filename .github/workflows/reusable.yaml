name: reusable deploy
on:
  workflow_call:
    inputs:
      artifact-name:
        description: The name of the deployable artifact files
        required: true
        default: dist
        type: string
jobs:
  deploy_r:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
      - name: List files
        run: ls
      - name: output info
        run: echo "deploy...............<"

