name: reusable deploy
on:
  workflow_call:
    inputs:
      artifact-name:
        description: The name of the deployable artifact files
        default: dist
        type: string
    secrets:
      some-secret:
        required: false
    outputs:
      result:
        description: Result of the reusable WF
        value: ${{ jobs.deploy_r.outputs.outcome }}
jobs:
  deploy_r:
    outputs:
      outcome: ${{ steps.set-result.outputs.step_res }}
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
      - name: List files
        run: ls
      - name: output info
        env:
          MY_SECRET: ${{ secrets.some-secret }}
        run: echo "deploy...............< ${{ secrets.some-secret }} (${#MY_SECRET} symbols)"
      - name: Set result output
        id: set-result
        run: echo "step_res=GOOD" >> $GITHUB_OUTPUTS"

